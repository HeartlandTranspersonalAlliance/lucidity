# Docker data is deliberately under /var so it is outside the immutable /usr
# deployment and persists across bootc upgrades and rollbacks.
d /var/lib/docker 0710 root docker -
d /var/lib/coolify-aws 0755 root root -
d /var/usrlocal 0755 root root -
d /var/usrlocal/bin 0755 root root -
d /root/.ssh 0700 root root -
d /etc/coolify-worker 0700 root root -
