[project]
name = "lucidity"
revision = "1.0"

[providers]
aws-production = "awssm://us-east-2?prefix=lucidity&kms_key_id=alias/lucidity-production-account-security&tag.Project=lucidity&tag.Environment=production&tag.ManagedBy=SecretSpec"
openbao-production = "openbao://127.0.0.1:8200/secret"

# The checked-in AWS alias declares storage policy, not credentials or values.
# Local providers remain selectable at invocation time. AWS authentication uses
# the standard SDK chain, including SSO and GitHub Actions OIDC roles.
[profiles.default]
ADMIN_SSH_PUBLIC_KEY = { description = "Administrator workstation OpenSSH public key (not confidential, kept local to avoid committing a machine identity)", required = true }
NEBULA_CA_PASSPHRASE = { description = "Passphrase for the encrypted Nebula CA private key", required = true }
CLOUDFLARE_API_TOKEN = { description = "CI-only Cloudflare API token", required = false }
BAO_TOKEN = { description = "Short-lived OpenBao operator token", required = false }
COOLIFY_API_TOKEN = { description = "Coolify API bearer token for operator or automation access", required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { description = "Disposable Coolify worker enrollment public key", required = false }
RESTIC_PASSWORD_FILE = { description = "Restic repository encryption password materialized as a private temporary file", required = false, as_path = true }
AWS_ACCESS_KEY_ID = { description = "Scoped S3-compatible backup access key identifier", required = false }
AWS_SECRET_ACCESS_KEY = { description = "Scoped S3-compatible backup secret access key", required = false }
AWS_SESSION_TOKEN = { description = "Optional scoped S3-compatible backup session token", required = false }
NTFY_ALERTMANAGER_TOKEN_FILE = { description = "Publish-only ntfy token materialized as a private temporary file", required = false, as_path = true }

[profiles.monitoring-controller]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
NTFY_ALERTMANAGER_TOKEN_FILE = { required = true, providers = ["openbao-production"] }

[profiles.backup-controller-aws]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
RESTIC_PASSWORD_FILE = { required = true, providers = ["openbao-production"] }

[profiles.backup-controller-s3]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
RESTIC_PASSWORD_FILE = { required = true, providers = ["openbao-production"] }
AWS_ACCESS_KEY_ID = { required = true, providers = ["openbao-production"] }
AWS_SECRET_ACCESS_KEY = { required = true, providers = ["openbao-production"] }
AWS_SESSION_TOKEN = { required = false, providers = ["openbao-production"] }

[profiles.backup-worker-aws]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
RESTIC_PASSWORD_FILE = { required = true, providers = ["aws-production"] }

[profiles.backup-worker-s3]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
RESTIC_PASSWORD_FILE = { required = true, providers = ["aws-production"] }
AWS_ACCESS_KEY_ID = { required = true, providers = ["aws-production"] }
AWS_SECRET_ACCESS_KEY = { required = true, providers = ["aws-production"] }
AWS_SESSION_TOKEN = { required = false, providers = ["aws-production"] }

[scopes.backup-aws]
secrets = ["RESTIC_PASSWORD_FILE"]

[scopes.backup-s3]
secrets = ["RESTIC_PASSWORD_FILE", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN"]

[scopes.monitoring]
secrets = ["NTFY_ALERTMANAGER_TOKEN_FILE"]

[profiles.operator]
ADMIN_SSH_PUBLIC_KEY = { required = true }
NEBULA_CA_PASSPHRASE = { required = true }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.ssh]
ADMIN_SSH_PUBLIC_KEY = { required = true }
NEBULA_CA_PASSPHRASE = { required = false }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.ca]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = true }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.ci]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
CLOUDFLARE_API_TOKEN = { required = true }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.coolify]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
COOLIFY_API_TOKEN = { required = true }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.vm-controller]
ADMIN_SSH_PUBLIC_KEY = { required = true }
NEBULA_CA_PASSPHRASE = { required = false }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.vm-worker]
ADMIN_SSH_PUBLIC_KEY = { required = true }
NEBULA_CA_PASSPHRASE = { required = false }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = true }
