[project]
name = "lucidity"
revision = "1.0"

# SecretSpec providers are selected at invocation time or in the operator's
# untracked global configuration. This keeps provider credentials and local
# values out of the repository as well as out of the Nix store.
[profiles.default]
ADMIN_SSH_PUBLIC_KEY = { description = "Administrator workstation OpenSSH public key (not confidential, kept local to avoid committing a machine identity)", required = true }
NEBULA_CA_PASSPHRASE = { description = "Passphrase for the encrypted Nebula CA private key", required = true }
CLOUDFLARE_API_TOKEN = { description = "CI-only Cloudflare API token", required = false }
BAO_TOKEN = { description = "Short-lived OpenBao operator token", required = false }
COOLIFY_API_TOKEN = { description = "Coolify API bearer token for operator or automation access", required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { description = "Disposable Coolify worker enrollment public key", required = false }

[profiles.operator]
ADMIN_SSH_PUBLIC_KEY = { required = true }
NEBULA_CA_PASSPHRASE = { required = true }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.ssh]
ADMIN_SSH_PUBLIC_KEY = { required = true }
NEBULA_CA_PASSPHRASE = { required = false }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.ca]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = true }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.ci]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
CLOUDFLARE_API_TOKEN = { required = true }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.coolify]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
COOLIFY_API_TOKEN = { required = true }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.vm-controller]
ADMIN_SSH_PUBLIC_KEY = { required = true }
NEBULA_CA_PASSPHRASE = { required = false }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.vm-worker]
ADMIN_SSH_PUBLIC_KEY = { required = true }
NEBULA_CA_PASSPHRASE = { required = false }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = true }
