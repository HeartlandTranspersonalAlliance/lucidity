[project]
name = "lucidity"
revision = "1.0"

[providers]
aws-production = "awssm://us-east-2?prefix=lucidity&kms_key_id=alias/lucidity-production-account-security&tag.Project=lucidity&tag.Environment=production&tag.ManagedBy=SecretSpec"
aws-controller-runtime = "awssm://us-east-2"
openbao-production = { uri = "openbao://127.0.0.1:8200/secret", credentials = { token = "local-keyring" } }
openbao-worker = "openbao://100.96.0.1:8200/secret"
local-dotenv = "dotenv://.env"
local-keyring = "keyring://lucidity"
onepassword-lucidity = "onepassword://Lucidity"
bitwarden-lucidity = "bw://Lucidity"
ci-environment = "env://"

# The checked-in AWS alias declares storage policy, not credentials or values.
# Local providers remain selectable at invocation time. AWS authentication uses
# the standard SDK chain, including SSO and GitHub Actions OIDC roles.
[profiles.default]
ADMIN_SSH_PUBLIC_KEY = { description = "Administrator workstation OpenSSH public key (not confidential, kept local to avoid committing a machine identity)", required = true }
NEBULA_CA_PASSPHRASE = { description = "Passphrase for the encrypted Nebula CA private key", required = true }
CLOUDFLARE_API_TOKEN = { description = "CI-only Cloudflare API token", required = false }
BAO_TOKEN = { description = "Short-lived OpenBao operator token", required = false }
COOLIFY_API_TOKEN = { description = "Coolify API bearer token for operator or automation access", required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { description = "Disposable Coolify worker enrollment public key", required = false }
RESTIC_PASSWORD_FILE = { description = "Restic repository encryption password materialized as a private temporary file", required = false, as_path = true }
AWS_ACCESS_KEY_ID = { description = "Scoped S3-compatible backup access key identifier", required = false }
AWS_SECRET_ACCESS_KEY = { description = "Scoped S3-compatible backup secret access key", required = false }
AWS_SESSION_TOKEN = { description = "Optional scoped S3-compatible backup session token", required = false }
NTFY_ALERTMANAGER_TOKEN_FILE = { description = "Publish-only ntfy token materialized as a private temporary file", required = false, as_path = true }
COOLIFY_APP_ID = { description = "Coolify application identifier", required = false }
COOLIFY_APP_KEY = { description = "Coolify application encryption key", required = false }
COOLIFY_DB_PASSWORD = { description = "Coolify database password", required = false }
COOLIFY_REDIS_PASSWORD = { description = "Coolify Redis password", required = false }
COOLIFY_PUSHER_APP_ID = { description = "Coolify Pusher application identifier", required = false }
COOLIFY_PUSHER_APP_KEY = { description = "Coolify Pusher application key", required = false }
COOLIFY_PUSHER_APP_SECRET = { description = "Coolify Pusher application secret", required = false }
OOYE_REGISTRATION_FILE = { description = "OOYE application-service registration materialized as a private temporary file", required = false, as_path = true }
OOYE_DISCORD_BOT_TOKEN_FILE = { description = "OOYE test-bot token materialized as a private temporary file", required = false, as_path = true }
MATRIX_REGISTRATION_TOKEN_FILE = { description = "One-time Matrix registration token materialized as a private temporary file", required = false, as_path = true }
MATRIX_ADMIN_PASSWORD_FILE = { description = "Synthetic Matrix administrator password materialized as a private temporary file", required = false, as_path = true }

[profiles.controller-runtime]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
COOLIFY_APP_ID = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/production/controller-runtime", field = "APP_ID" } }
COOLIFY_APP_KEY = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/production/controller-runtime", field = "APP_KEY" } }
COOLIFY_DB_PASSWORD = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/production/controller-runtime", field = "DB_PASSWORD" } }
COOLIFY_REDIS_PASSWORD = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/production/controller-runtime", field = "REDIS_PASSWORD" } }
COOLIFY_PUSHER_APP_ID = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/production/controller-runtime", field = "PUSHER_APP_ID" } }
COOLIFY_PUSHER_APP_KEY = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/production/controller-runtime", field = "PUSHER_APP_KEY" } }
COOLIFY_PUSHER_APP_SECRET = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/production/controller-runtime", field = "PUSHER_APP_SECRET" } }

[profiles.test-controller-runtime]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
COOLIFY_APP_ID = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/test/controller-runtime", field = "APP_ID" } }
COOLIFY_APP_KEY = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/test/controller-runtime", field = "APP_KEY" } }
COOLIFY_DB_PASSWORD = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/test/controller-runtime", field = "DB_PASSWORD" } }
COOLIFY_REDIS_PASSWORD = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/test/controller-runtime", field = "REDIS_PASSWORD" } }
COOLIFY_PUSHER_APP_ID = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/test/controller-runtime", field = "PUSHER_APP_ID" } }
COOLIFY_PUSHER_APP_KEY = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/test/controller-runtime", field = "PUSHER_APP_KEY" } }
COOLIFY_PUSHER_APP_SECRET = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/test/controller-runtime", field = "PUSHER_APP_SECRET" } }

[profiles.test-monitoring-controller]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
NTFY_ALERTMANAGER_TOKEN_FILE = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/test/monitoring-tokens", field = "ntfy_alertmanager_token" }, as_path = true }

[profiles.test-matrix-bootstrap]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
MATRIX_REGISTRATION_TOKEN_FILE = { required = true, providers = ["openbao-worker"], ref = { item = "lucidity/test/matrix-bootstrap", field = "registration_token" }, as_path = true }
MATRIX_ADMIN_PASSWORD_FILE = { required = true, providers = ["openbao-worker"], ref = { item = "lucidity/test/matrix-bootstrap", field = "admin_password" }, as_path = true }

[profiles.matrix-bootstrap]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
MATRIX_REGISTRATION_TOKEN_FILE = { required = true, providers = ["openbao-worker"], ref = { item = "lucidity/production/matrix-bootstrap", field = "registration_token" }, as_path = true }
MATRIX_ADMIN_PASSWORD_FILE = { required = true, providers = ["openbao-worker"], ref = { item = "lucidity/production/matrix-bootstrap", field = "admin_password" }, as_path = true }

[profiles.test-ooye-worker]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
OOYE_REGISTRATION_FILE = { required = true, providers = ["openbao-worker"], ref = { item = "lucidity/test/worker-ooye", field = "registration" }, as_path = true }
OOYE_DISCORD_BOT_TOKEN_FILE = { required = true, providers = ["openbao-worker"], ref = { item = "lucidity/test/worker-ooye", field = "discord_bot_token" }, as_path = true }

[profiles.test-backup-controller]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
RESTIC_PASSWORD_FILE = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/test/restic-controller", field = "password" }, as_path = true }

[profiles.test-backup-worker]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
RESTIC_PASSWORD_FILE = { required = true, providers = ["aws-controller-runtime"], ref = { item = "lucidity/test/restic-worker", field = "password" }, as_path = true }

[profiles.monitoring-controller]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
NTFY_ALERTMANAGER_TOKEN_FILE = { required = true, providers = ["openbao-production"] }

[profiles.ooye-worker]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
OOYE_REGISTRATION_FILE = { required = true, providers = ["openbao-worker"], ref = { item = "lucidity/production/worker-ooye", field = "registration" }, as_path = true }

[profiles.backup-controller-aws]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
RESTIC_PASSWORD_FILE = { required = true, providers = ["openbao-production"] }

[profiles.backup-controller-s3]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
RESTIC_PASSWORD_FILE = { required = true, providers = ["openbao-production"] }
AWS_ACCESS_KEY_ID = { required = true, providers = ["openbao-production"] }
AWS_SECRET_ACCESS_KEY = { required = true, providers = ["openbao-production"] }
AWS_SESSION_TOKEN = { required = false, providers = ["openbao-production"] }

[profiles.backup-worker-aws]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
RESTIC_PASSWORD_FILE = { required = true, providers = ["aws-production"] }

[profiles.backup-worker-s3]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
RESTIC_PASSWORD_FILE = { required = true, providers = ["aws-production"] }
AWS_ACCESS_KEY_ID = { required = true, providers = ["aws-production"] }
AWS_SECRET_ACCESS_KEY = { required = true, providers = ["aws-production"] }
AWS_SESSION_TOKEN = { required = false, providers = ["aws-production"] }

[scopes.backup-aws]
secrets = ["RESTIC_PASSWORD_FILE"]

[scopes.backup-s3]
secrets = ["RESTIC_PASSWORD_FILE", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN"]

[scopes.monitoring]
secrets = ["NTFY_ALERTMANAGER_TOKEN_FILE"]

[scopes.ooye-registration]
secrets = ["OOYE_REGISTRATION_FILE"]

[scopes.ooye-test-bot]
secrets = ["OOYE_REGISTRATION_FILE", "OOYE_DISCORD_BOT_TOKEN_FILE"]

[scopes.matrix-bootstrap]
secrets = ["MATRIX_REGISTRATION_TOKEN_FILE", "MATRIX_ADMIN_PASSWORD_FILE"]

[scopes.controller-runtime]
secrets = ["COOLIFY_APP_ID", "COOLIFY_APP_KEY", "COOLIFY_DB_PASSWORD", "COOLIFY_REDIS_PASSWORD", "COOLIFY_PUSHER_APP_ID", "COOLIFY_PUSHER_APP_KEY", "COOLIFY_PUSHER_APP_SECRET"]

[scopes.operator-management]
secrets = ["ADMIN_SSH_PUBLIC_KEY", "NEBULA_CA_PASSPHRASE", "CLOUDFLARE_API_TOKEN", "COOLIFY_API_TOKEN", "COOLIFY_WORKER_SSH_PUBLIC_KEY"]

[scopes.openbao-cli]
secrets = ["BAO_TOKEN"]

[profiles.operator]
ADMIN_SSH_PUBLIC_KEY = { required = true, providers = ["openbao-production"] }
NEBULA_CA_PASSPHRASE = { required = true, providers = ["openbao-production"] }
CLOUDFLARE_API_TOKEN = { required = false, providers = ["openbao-production"] }
# OpenBao cannot supply the credential used to authenticate to itself. Its
# alias reads the short-lived provider credential from local-keyring.
BAO_TOKEN = { required = false, providers = ["local-keyring"] }
COOLIFY_API_TOKEN = { required = false, providers = ["openbao-production"] }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false, providers = ["openbao-production"] }

[profiles.ssh]
ADMIN_SSH_PUBLIC_KEY = { required = true }
NEBULA_CA_PASSPHRASE = { required = false }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.ca]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = true }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.ci]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
CLOUDFLARE_API_TOKEN = { required = true, providers = ["ci-environment"] }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.coolify]
ADMIN_SSH_PUBLIC_KEY = { required = false }
NEBULA_CA_PASSPHRASE = { required = false }
COOLIFY_API_TOKEN = { required = true, providers = ["openbao-production"] }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.vm-controller]
ADMIN_SSH_PUBLIC_KEY = { required = true }
NEBULA_CA_PASSPHRASE = { required = false }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = false }

[profiles.vm-worker]
ADMIN_SSH_PUBLIC_KEY = { required = true }
NEBULA_CA_PASSPHRASE = { required = false }
CLOUDFLARE_API_TOKEN = { required = false }
BAO_TOKEN = { required = false }
COOLIFY_API_TOKEN = { required = false }
COOLIFY_WORKER_SSH_PUBLIC_KEY = { required = true }
