name: Update locked Nix inputs

on:
  schedule:
    - cron: "31 9 * * 1"
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
        with:
          kvm: true

      - name: Update flake lock and open a pull request
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          token: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
          commit-msg: Update locked Nix inputs
          pr-title: Update locked Nix inputs
