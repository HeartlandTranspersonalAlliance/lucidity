name: Validate bootc switch and rollback delivery

on:
  workflow_dispatch:
    inputs:
      confirm_update_rollback:
        description: Build a disposable CentOS bootc AMI, switch to the AlmaLinux worker, roll back, validate persistent state, and clean up
        required: true
        type: boolean
        default: false
      worker_revision:
        description: Full Git revision of an already-published immutable worker image (defaults to the workflow revision)
        required: false
        type: string

concurrency:
  group: ami-switch-rollback-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: us-east-2
  CENTOS_BOOTC_IMAGE: quay.io/centos-bootc/centos-bootc:stream10@sha256:2b7e3b1abf8db094d1efb083721dc0f72e6feeef2355fc16ea010d0266b2bb95
  CI_TOOLS_IMAGE: localhost/coolify-aws-ci-tools:ami-switch-benchmark
  BOOTSTRAP_IMAGE: localhost/lucidity-centos-bootc-bootstrap:benchmark
  TARGET_REVISION: ${{ inputs.worker_revision || github.sha }}
  NIX_CACHE_WRITE: ${{ github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main' && inputs.confirm_update_rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          kvm: true

      - name: Require the Cachix write token for trusted events
        if: env.NIX_CACHE_WRITE == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "${CACHIX_AUTH_TOKEN}" || { echo '::error::CACHIX_AUTH_TOKEN is required for trusted cache-writing events'; exit 1; }

      - name: Configure the public Lucidity Nix cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: lucidity
          authToken: ${{ env.NIX_CACHE_WRITE == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.NIX_CACHE_WRITE != 'true' }}
          pushFilter: lucidity-(controller|worker)-bootc-context

      - name: Require configured benchmark identifiers
        env:
          AMI_ROLE_ARN: ${{ vars.AWS_AMI_IMPORT_ROLE_ARN }}
          SNAPSHOT_KMS_KEY_ARN: ${{ vars.AWS_AMI_SNAPSHOT_KMS_KEY_ARN }}
          TEST_INSTANCE_PROFILE: ${{ vars.AWS_AMI_TEST_WORKER_INSTANCE_PROFILE_NAME }}
          TEST_SECURITY_GROUP: ${{ vars.AWS_AMI_TEST_WORKER_SECURITY_GROUP_ID }}
          TEST_SUBNET: ${{ vars.AWS_AMI_TEST_SUBNET_ID }}
          WORKER_REPOSITORY_URL: ${{ vars.AWS_ECR_WORKER_REPOSITORY_URL }}
        run: nix run .#ci -- benchmark resolve

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          allowed-account-ids: 467590374785
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_AMI_IMPORT_ROLE_ARN }}
          role-duration-seconds: 10800
          role-session-name: lucidity-ami-switch-${{ github.run_id }}

      - name: Verify immutable AlmaLinux worker target
        run: nix run .#ci -- benchmark verify-target

      - id: cache
        name: Authenticate to GHCR and restore benchmark cache
        env:
          GHCR_CACHE_ENGINE: podman
          GHCR_CACHE_WRITE: true
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#lucidity -- ci cache configure benchmark-base

      - name: Build management-enabled CentOS bootc bootstrap image
        run: |
          sudo env \
            PATH="${PATH}" \
            BASE_IMAGE="${CENTOS_BOOTC_IMAGE}" \
            BUILD_CACHE_FROM="${BUILD_CACHE_FROM}" \
            BUILD_CACHE_TO="${BUILD_CACHE_TO}" \
            CONTAINER_ENGINE=podman \
            IMAGE_NAME="${BOOTSTRAP_IMAGE}" \
            IMAGE_VERSION="benchmark-${GITHUB_SHA}" \
            REGISTRY_AUTH_FILE="${REGISTRY_AUTH_FILE}" \
            nix run .#lucidity -- build worker

      - name: Rotate the role cache login before tooling
        run: nix run .#ci -- cache cleanup

      - id: tooling-cache
        name: Restore the GHCR tooling cache
        env:
          GHCR_CACHE_ENGINE: podman
          GHCR_CACHE_WRITE: true
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#ci -- cache configure ci-tools

      - name: Build pinned image tooling
        run: sudo env PATH="${PATH}" LUCIDITY_REPOSITORY_ROOT="${GITHUB_WORKSPACE}" CONTAINER_ENGINE=podman CI_TOOLS_IMAGE="${CI_TOOLS_IMAGE}" BUILD_CACHE_FROM="${BUILD_CACHE_FROM}" BUILD_CACHE_TO="${BUILD_CACHE_TO}" REGISTRY_AUTH_FILE="${REGISTRY_AUTH_FILE}" nix run .#ci -- build-tools-image

      - name: Build and validate CentOS bootc raw AMI artifact
        run: |
          sudo env \
            CONTAINER_ENGINE=podman \
            IMAGE_NAME="${BOOTSTRAP_IMAGE}" \
            IMAGE_OUTPUT_NAME=lucidity-centos-bootstrap-ami \
            VM_TOOL_IMAGE="${CI_TOOLS_IMAGE}" \
            nix run .#disk -- build worker ami
          sudo env \
            CONTAINER_ENGINE=podman \
            VM_TOOL_IMAGE="${CI_TOOLS_IMAGE}" \
            nix run .#disk -- validate image-output/worker/lucidity-centos-bootstrap-ami.raw

      - name: Upload, boot, switch, roll back, and validate persistent state
        env:
          AMI_LAUNCH_VALIDATION: true
          AMI_LIFECYCLE: disposable
          AMI_ROLE: worker
          AMI_SNAPSHOT_KMS_KEY_ARN: ${{ vars.AWS_AMI_SNAPSHOT_KMS_KEY_ARN }}
          AMI_SOURCE_REVISION: ${{ env.TARGET_REVISION }}
          AMI_SWITCH_TARGET_REF: ${{ env.WORKER_IMAGE_REF }}
          AMI_TEST_INSTANCE_PROFILE_NAME: ${{ vars.AWS_AMI_TEST_WORKER_INSTANCE_PROFILE_NAME }}
          AMI_TEST_INSTANCE_TYPE: t3a.small
          AMI_TEST_SECURITY_GROUP_ID: ${{ vars.AWS_AMI_TEST_WORKER_SECURITY_GROUP_ID }}
          AMI_TEST_SUBNET_ID: ${{ vars.AWS_AMI_TEST_SUBNET_ID }}
        run: nix run .#ami -- validate image-output/worker/lucidity-centos-bootstrap-ami.raw

      - name: Remove GHCR login and BuildKit builder
        if: always()
        run: nix run .#lucidity -- ci cache cleanup
