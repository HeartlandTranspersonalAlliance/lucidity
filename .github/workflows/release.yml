name: Release bootc appliance

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Automatic uses conventional commits; override only when release impact differs
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

concurrency:
  group: lucidity-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  GH_TOKEN: ${{ github.token }}
  NIX_CACHE_WRITE: ${{ github.event_name == 'merge_group' || github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    name: Select version and require tested images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.version.outputs.source_sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          kvm: true

      - name: Require the Cachix write token for trusted events
        if: env.NIX_CACHE_WRITE == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "${CACHIX_AUTH_TOKEN}" || { echo '::error::CACHIX_AUTH_TOKEN is required for trusted cache-writing events'; exit 1; }

      - name: Configure the public Lucidity Nix cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: lucidity
          authToken: ${{ env.NIX_CACHE_WRITE == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.NIX_CACHE_WRITE != 'true' }}
          pushFilter: lucidity-(controller|worker)-bootc-context

      - name: Calculate and validate the semantic version
        id: version
        env:
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: nix run .#release -- prepare "${REQUESTED_BUMP}"

  candidate:
    name: Require immutable candidates
    needs: prepare
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  images:
    name: Promote and inventory ${{ matrix.role }}
    needs:
      - prepare
      - candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - role: controller
            repository_url: ${{ vars.AWS_ECR_CONTROLLER_REPOSITORY_URL }}
          - role: worker
            repository_url: ${{ vars.AWS_ECR_WORKER_REPOSITORY_URL }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          kvm: true

      - name: Require the Cachix write token for trusted events
        if: env.NIX_CACHE_WRITE == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "${CACHIX_AUTH_TOKEN}" || { echo '::error::CACHIX_AUTH_TOKEN is required for trusted cache-writing events'; exit 1; }

      - name: Configure the public Lucidity Nix cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: lucidity
          authToken: ${{ env.NIX_CACHE_WRITE == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.NIX_CACHE_WRITE != 'true' }}
          pushFilter: lucidity-(controller|worker)-bootc-context

      - name: Configure short-lived ECR credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          allowed-account-ids: 467590374785
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          role-duration-seconds: 3600
          role-session-name: lucidity-release-${{ github.run_id }}-${{ matrix.role }}

      - name: Promote the immutable image and generate its SBOM
        id: image
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY_URL: ${{ matrix.repository_url }}
          ROLE: ${{ matrix.role }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: nix run .#release -- image "${ROLE}" "${REPOSITORY_URL}" "${RELEASE_TAG}" "${SOURCE_SHA}"

      - name: Attest the SBOM against the immutable image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.repository_url }}
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: ${{ steps.image.outputs.path }}

      - name: Upload release inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.role }}
          if-no-files-found: error
          path: release/
          retention-days: 7

  inventory:
    name: Validate role release inventories
    needs:
      - prepare
      - images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      controller_digest: ${{ steps.inventory.outputs.controller_digest }}
      controller_sbom_sha256: ${{ steps.inventory.outputs.controller_sbom_sha256 }}
      worker_digest: ${{ steps.inventory.outputs.worker_digest }}
      worker_sbom_sha256: ${{ steps.inventory.outputs.worker_sbom_sha256 }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          kvm: true

      - name: Require the Cachix write token for trusted events
        if: env.NIX_CACHE_WRITE == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "${CACHIX_AUTH_TOKEN}" || { echo '::error::CACHIX_AUTH_TOKEN is required for trusted cache-writing events'; exit 1; }

      - name: Configure the public Lucidity Nix cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: lucidity
          authToken: ${{ env.NIX_CACHE_WRITE == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.NIX_CACHE_WRITE != 'true' }}
          pushFilter: lucidity-(controller|worker)-bootc-context

      - name: Download image inventories
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          merge-multiple: true
          path: release
          pattern: release-*

      - name: Validate and expose role metadata
        id: inventory
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: nix run .#release -- inventory "${RELEASE_TAG}"

  controller-ami:
    name: Retain and validate controller AMI
    needs:
      - prepare
      - inventory
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/ami.yml
    with:
      ami_role: controller
      run_aws_validation: true
      ami_lifecycle: retained
      run_aws_launch: true
      release_version: ${{ needs.prepare.outputs.tag }}
      source_image_digest: ${{ needs.inventory.outputs.controller_digest }}
      sbom_sha256: ${{ needs.inventory.outputs.controller_sbom_sha256 }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  worker-ami:
    name: Retain and validate worker AMI
    needs:
      - prepare
      - inventory
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/ami.yml
    with:
      ami_role: worker
      run_aws_validation: true
      ami_lifecycle: retained
      run_aws_launch: true
      release_version: ${{ needs.prepare.outputs.tag }}
      source_image_digest: ${{ needs.inventory.outputs.worker_digest }}
      sbom_sha256: ${{ needs.inventory.outputs.worker_sbom_sha256 }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  release:
    name: Publish immutable release
    needs:
      - prepare
      - images
      - inventory
      - controller-ami
      - worker-ami
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          kvm: true

      - name: Require the Cachix write token for trusted events
        if: env.NIX_CACHE_WRITE == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "${CACHIX_AUTH_TOKEN}" || { echo '::error::CACHIX_AUTH_TOKEN is required for trusted cache-writing events'; exit 1; }

      - name: Configure the public Lucidity Nix cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: lucidity
          authToken: ${{ env.NIX_CACHE_WRITE == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.NIX_CACHE_WRITE != 'true' }}
          pushFilter: lucidity-(controller|worker)-bootc-context

      - name: Download image inventories
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          merge-multiple: true
          path: release
          pattern: release-*

      - name: Configure short-lived AMI metadata credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          allowed-account-ids: 467590374785
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_AMI_IMPORT_ROLE_ARN }}
          role-duration-seconds: 3600
          role-session-name: lucidity-release-manifest-${{ github.run_id }}

      - name: Create the release manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: nix run .#release -- manifest "${RELEASE_TAG}" "${RELEASE_VERSION}" "${SOURCE_SHA}"

      - name: Publish the immutable GitHub release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: nix run .#release -- publish "${RELEASE_TAG}" "${RELEASE_VERSION}" "${SOURCE_SHA}"
