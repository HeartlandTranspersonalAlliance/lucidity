name: Validate locked flake

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: lucidity-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hermetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Enable KVM for flake-declared NixOS tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Evaluate and build the authoritative hermetic check graph
        run: nix flake check --show-trace --print-build-logs

  lifecycle:
    needs: hermetic
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        role: [controller, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Enable KVM for the flake application
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore the role-scoped OCI cache
        env:
          GHCR_CACHE_WRITE: true
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#ci -- cache configure "${{ matrix.role }}"
      - name: Run the flake-owned bootc switch and rollback lifecycle
        env:
          CONTAINER_ENGINE: docker
          LUCIDITY_FULL_GUEST_TEST: "1"
        run: nix run ".#test-${{ matrix.role }}"
      - name: Remove OCI cache credentials
        if: always()
        run: nix run .#ci -- cache cleanup

  required:
    name: required
    if: always()
    needs: [hermetic, lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the hermetic graph and applicable lifecycle
        env:
          HERMETIC_RESULT: ${{ needs.hermetic.result }}
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
        run: |
          [[ ${HERMETIC_RESULT} == success ]]
          [[ ${LIFECYCLE_RESULT} == success || ${LIFECYCLE_RESULT} == skipped ]]
