name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: localhost/coolify-bootc-worker:lifecycle-v1
  UPDATE_IMAGE: localhost/coolify-bootc-worker:lifecycle-v2
  CONTROLLER_IMAGE: localhost/coolify-bootc-controller:ci
  CI_TOOLS_IMAGE: localhost/coolify-aws-ci-tools:ci

jobs:
  worker-changes:
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Decide whether worker lifecycle validation is required
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${EVENT_NAME}" != pull_request ]]; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_paths="${RUNNER_TEMP}/worker-changed-paths"
          if ! git diff --name-only --diff-filter=ACDMRT \
              "${BASE_SHA}" "${HEAD_SHA}" > "${changed_paths}"; then
            echo "Could not determine changed paths; requiring full worker validation" >&2
            echo "required=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          required=$(ci/worker-changes.sh < "${changed_paths}")
          echo "required=${required}" >> "${GITHUB_OUTPUT}"

  opentofu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Format, validate, and test OpenTofu
        run: nix develop --command make tofu-check

  shell-and-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint shell and test repository logic
        run: make lint test

      - name: Lint GitHub Actions workflows
        run: |
          source ci/images.env
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            --workdir /repo \
          "${ACTIONLINT_IMAGE}" -color

  controller-image:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare role-scoped GHCR build cache
        env:
          GHCR_CACHE_WRITE: ${{ github.event_name != 'pull_request' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/setup-build-cache.sh controller

      - name: Build controller foundation
        env:
          CONTAINER_ENGINE: docker
          IMAGE_NAME: ${{ env.CONTROLLER_IMAGE }}
          IMAGE_VERSION: controller-ci
        run: ./scripts/build.sh controller

      - name: Validate controller bootc image and Nix mountpoint
        env:
          CONTAINER_ENGINE: docker
        run: ./scripts/validate-image.sh "${CONTROLLER_IMAGE}"

      - name: Remove GHCR login and BuildKit builder
        if: always()
        run: ci/teardown-build-cache.sh

  worker-lifecycle:
    needs: worker-changes
    if: needs.worker-changes.outputs.required == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare role-scoped GHCR build cache
        env:
          GHCR_CACHE_WRITE: ${{ github.event_name != 'pull_request' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/setup-build-cache.sh worker

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Report runner capacity
        run: |
          df -h /
          docker system df
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo "KVM acceleration is available"
          else
            echo "KVM unavailable; lifecycle test will use QEMU TCG"
          fi

      - name: Build pinned CI tooling image
        run: |
          source image/image-builder.env
          docker build \
            --build-arg "IMAGE_BUILDER_IMAGE=${IMAGE_BUILDER_IMAGE}" \
            --tag "${CI_TOOLS_IMAGE}" \
            --file ci/Containerfile \
            .

      - name: Build worker bootc image
        env:
          CONTAINER_ENGINE: docker
          IMAGE_VERSION: lifecycle-v1
        run: make build-worker

      - name: Validate worker bootc image
        env:
          CONTAINER_ENGINE: docker
        run: ./scripts/validate-image.sh "${IMAGE}"

      - name: Build and validate worker QCOW2
        env:
          CONTAINER_ENGINE: docker
          IMAGE_NAME: ${{ env.IMAGE }}
          VM_TOOL_IMAGE: ${{ env.CI_TOOLS_IMAGE }}
        run: |
          ./scripts/build-disk.sh worker qcow2
          make validate-disk-worker

      - name: Build update image and publish lifecycle images locally
        env:
          CONTAINER_ENGINE: docker
          IMAGE_NAME: ${{ env.UPDATE_IMAGE }}
          IMAGE_VERSION: lifecycle-v2
        run: |
          ./scripts/build.sh worker
          make vm-registry-start-worker

      - name: Boot worker and validate reboot, update, and rollback persistence
        env:
          CONTAINER_ENGINE: docker
          VM_TOOL_IMAGE: ${{ env.CI_TOOLS_IMAGE }}
          VM_WAIT_ATTEMPTS: 300
        run: |
          cleanup() {
            status=$?
            if ((status != 0)); then
              docker logs coolify-worker-vm || true
            fi
            make vm-stop-worker || true
            make vm-registry-stop-worker || true
            exit "${status}"
          }
          trap cleanup EXIT
          make vm-init-worker
          make vm-start-worker
          make vm-validate-worker
          make vm-update-rollback-worker

      - name: Remove GHCR login and BuildKit builder
        if: always()
        run: ci/teardown-build-cache.sh
