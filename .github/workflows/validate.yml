name: Validate locked flake

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      lifecycle_cache:
        description: Use isolated to bypass Lucidity's Cachix and GHCR caches for release validation
        required: true
        type: choice
        options:
          - warm
          - isolated
        default: warm

concurrency:
  group: lucidity-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NIX_CACHE_WRITE: ${{ github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  prepare:
    name: Nix prepare
    outputs:
      plan: ${{ steps.workflow-plan.outputs.plan }}
      lifecycle_controller: ${{ steps.workflow-plan.outputs.controller }}
      lifecycle_worker: ${{ steps.workflow-plan.outputs.worker }}
      lifecycle_fallback: ${{ steps.workflow-plan.outputs.fallback }}
      lifecycle_reason: ${{ steps.workflow-plan.outputs.reason }}
      lifecycle_cache: ${{ steps.workflow-plan.outputs.cache_mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
          persist-credentials: false
      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          kvm: true
      - name: Require the Cachix write token for trusted events
        if: env.NIX_CACHE_WRITE == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix run .#ci-require-env -- CACHIX_AUTH_TOKEN
      - name: Configure the public Lucidity Nix cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: lucidity
          authToken: ${{ env.NIX_CACHE_WRITE == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.NIX_CACHE_WRITE != 'true' }}
          pushFilter: lucidity-(controller|worker)-bootc-context
      - name: Prepare the authoritative CI plan
        id: workflow-plan
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || '' }}
          LIFECYCLE_CACHE: ${{ inputs.lifecycle_cache || 'warm' }}
        run: nix run .#ci-workflow-prepare -- "${{ github.event_name }}"
      - name: Evaluate and build the authoritative hermetic check graph
        run: nix run .#ci-hermetic-check

  lifecycle-controller:
    needs: prepare
    if: fromJSON(needs.prepare.outputs.plan).targets.controller.run
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          kvm: true
      - name: Require the Cachix write token for trusted events
        if: env.NIX_CACHE_WRITE == 'true' && fromJSON(needs.prepare.outputs.plan).cache_mode != 'isolated'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix run .#ci-require-env -- CACHIX_AUTH_TOKEN
      - name: Configure the public Lucidity Nix cache
        if: fromJSON(needs.prepare.outputs.plan).cache_mode != 'isolated'
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: lucidity
          authToken: ${{ env.NIX_CACHE_WRITE == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.NIX_CACHE_WRITE != 'true' }}
          pushFilter: lucidity-(controller|worker)-bootc-context
      - name: Restore the role-scoped OCI cache
        if: fromJSON(needs.prepare.outputs.plan).cache_mode != 'isolated'
        env:
          GHCR_CACHE_WRITE: true
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#ci -- cache configure controller
      - name: Run the flake-owned bootc switch and rollback lifecycle
        if: fromJSON(needs.prepare.outputs.plan).cache_mode != 'isolated'
        env:
          CONTAINER_ENGINE: docker
          LUCIDITY_FULL_GUEST_TEST: "1"
          LUCIDITY_VM_CONNECTIVITY_ONLY: "1"
        run: nix run .#test-controller
      - name: Run the isolated-cache bootc switch and rollback lifecycle
        if: fromJSON(needs.prepare.outputs.plan).cache_mode == 'isolated'
        env:
          CONTAINER_ENGINE: docker
          LUCIDITY_FULL_GUEST_TEST: "1"
          LUCIDITY_VM_CONNECTIVITY_ONLY: "1"
        run: nix --option extra-substituters "" run .#test-controller
      - name: Remove OCI cache credentials
        if: always() && fromJSON(needs.prepare.outputs.plan).cache_mode != 'isolated'
        run: nix run .#ci -- cache cleanup

  lifecycle-worker:
    needs: prepare
    if: fromJSON(needs.prepare.outputs.plan).targets.worker.run
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          kvm: true
      - name: Require the Cachix write token for trusted events
        if: env.NIX_CACHE_WRITE == 'true' && fromJSON(needs.prepare.outputs.plan).cache_mode != 'isolated'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix run .#ci-require-env -- CACHIX_AUTH_TOKEN
      - name: Configure the public Lucidity Nix cache
        if: fromJSON(needs.prepare.outputs.plan).cache_mode != 'isolated'
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: lucidity
          authToken: ${{ env.NIX_CACHE_WRITE == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.NIX_CACHE_WRITE != 'true' }}
          pushFilter: lucidity-(controller|worker)-bootc-context
      - name: Restore the role-scoped OCI cache
        if: fromJSON(needs.prepare.outputs.plan).cache_mode != 'isolated'
        env:
          GHCR_CACHE_WRITE: true
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#ci -- cache configure worker
      - name: Run the flake-owned bootc switch and rollback lifecycle
        if: fromJSON(needs.prepare.outputs.plan).cache_mode != 'isolated'
        env:
          CONTAINER_ENGINE: docker
          LUCIDITY_FULL_GUEST_TEST: "1"
        run: nix run .#test-worker
      - name: Run the isolated-cache bootc switch and rollback lifecycle
        if: fromJSON(needs.prepare.outputs.plan).cache_mode == 'isolated'
        env:
          CONTAINER_ENGINE: docker
          LUCIDITY_FULL_GUEST_TEST: "1"
        run: nix --option extra-substituters "" run .#test-worker
      - name: Remove OCI cache credentials
        if: always() && fromJSON(needs.prepare.outputs.plan).cache_mode != 'isolated'
        run: nix run .#ci -- cache cleanup

  required:
    name: required
    if: always()
    needs: [prepare, lifecycle-controller, lifecycle-worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Configure the public Lucidity Nix cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: lucidity
          authToken: ""
          skipPush: true
          pushFilter: lucidity-(controller|worker)-bootc-context
      - name: Enforce the authoritative CI plan
        env:
          WORKFLOW_PLAN: ${{ needs.prepare.outputs.plan }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CONTROLLER_RESULT: ${{ needs.lifecycle-controller.result }}
          WORKER_RESULT: ${{ needs.lifecycle-worker.result }}
        run: nix run .#ci-workflow-gate
