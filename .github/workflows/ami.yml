name: Validate AMI compatibility

on:
  pull_request:
    paths:
      - .github/workflows/ami.yml
      - scripts/build-disk.sh
      - scripts/validate-disk.sh
  workflow_call:
    inputs:
      ami_role:
        description: Appliance role to build and validate
        required: true
        type: string
      run_aws_validation:
        description: Upload the raw artifact, register an AMI, and validate its AWS metadata
        required: true
        type: boolean
      ami_lifecycle:
        description: Disposable cleans up; retained preserves an immutable boot-validated AMI
        required: true
        type: string
      run_aws_launch:
        description: Boot the AMI on t3a.small and validate the guest through SSM
        required: true
        type: boolean
      release_version:
        description: Optional immutable vX.Y.Z release associated with a retained AMI
        required: false
        type: string
        default: ""
      source_image_digest:
        description: Optional immutable OCI digest associated with the selected role
        required: false
        type: string
        default: ""
      sbom_sha256:
        description: Optional SHA-256 of the selected role's SPDX SBOM
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ami_role:
        description: Appliance role to build and validate
        required: true
        type: choice
        options:
          - worker
          - controller
        default: worker
      run_aws_validation:
        description: Upload the raw artifact, register a disposable AMI, and validate its AWS metadata
        required: true
        type: boolean
        default: false
      ami_lifecycle:
        description: Disposable validates and cleans up; retained publishes an immutable boot-validated role AMI
        required: true
        type: choice
        options:
          - disposable
          - retained
        default: disposable
      run_aws_launch:
        description: Boot the AMI on t3a.small and validate the guest through SSM
        required: true
        type: boolean
        default: false
      release_version:
        description: Optional immutable vX.Y.Z release associated with a retained AMI
        required: false
        type: string
        default: ""
      source_image_digest:
        description: Optional immutable OCI digest associated with the selected role
        required: false
        type: string
        default: ""
      sbom_sha256:
        description: Optional SHA-256 of the selected role's SPDX SBOM
        required: false
        type: string
        default: ""

concurrency:
  group: ami-validation-${{ github.ref }}-${{ inputs.ami_role || 'worker' }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AMI_ROLE: ${{ inputs.ami_role || 'worker' }}
  AWS_REGION: us-east-2
  CI_TOOLS_IMAGE: localhost/coolify-aws-ci-tools:ami
  IMAGE: localhost/coolify-bootc-${{ inputs.ami_role || 'worker' }}:ami-validation

jobs:
  ami:
    name: Validate ${{ inputs.ami_role || 'worker' }} AMI
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Report runner capacity
        run: |
          df -h /
          docker system df
          sudo podman system df

      - name: Resolve role configuration and image reference
        env:
          AMI_LIFECYCLE: ${{ inputs.ami_lifecycle || 'disposable' }}
          ECR_CONTROLLER_REPOSITORY_URL: ${{ vars.AWS_ECR_CONTROLLER_REPOSITORY_URL }}
          ECR_WORKER_REPOSITORY_URL: ${{ vars.AWS_ECR_WORKER_REPOSITORY_URL }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          TEST_CONTROLLER_INSTANCE_PROFILE: ${{ vars.AWS_AMI_TEST_CONTROLLER_INSTANCE_PROFILE_NAME }}
          TEST_CONTROLLER_SECURITY_GROUP: ${{ vars.AWS_AMI_TEST_CONTROLLER_SECURITY_GROUP_ID }}
          TEST_WORKER_INSTANCE_PROFILE: ${{ vars.AWS_AMI_TEST_WORKER_INSTANCE_PROFILE_NAME }}
          TEST_WORKER_SECURITY_GROUP: ${{ vars.AWS_AMI_TEST_WORKER_SECURITY_GROUP_ID }}
        run: nix run .#ci -- ami resolve

      - name: Configure AWS credentials for retained ECR candidate
        if: inputs.ami_lifecycle == 'retained'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          allowed-account-ids: 467590374785
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_AMI_IMPORT_ROLE_ARN }}
          role-duration-seconds: 10800
          role-session-name: lucidity-ami-source-${{ github.run_id }}

      - name: Pull immutable ECR role candidate
        if: inputs.ami_lifecycle == 'retained'
        env:
          SOURCE_IMAGE_DIGEST: ${{ inputs.source_image_digest }}
        run: nix run .#ci -- ami pull

      - name: Build pinned image tooling
        env:
          AMI_LIFECYCLE: ${{ inputs.ami_lifecycle || 'disposable' }}
        run: |
          if [[ "${AMI_LIFECYCLE}" == retained ]]; then
            sudo env PATH="${PATH}" LUCIDITY_REPOSITORY_ROOT="${GITHUB_WORKSPACE}" CONTAINER_ENGINE=podman CI_TOOLS_IMAGE="${CI_TOOLS_IMAGE}" nix run .#ci -- build-tools-image
          else
            CONTAINER_ENGINE=docker nix run .#ci -- build-tools-image
          fi

      - id: cache
        name: Authenticate to GHCR and restore role-scoped cache
        if: inputs.ami_lifecycle != 'retained'
        env:
          GHCR_CACHE_WRITE: ${{ github.event_name != 'pull_request' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#lucidity -- ci cache configure "${AMI_ROLE}"

      - name: Build AMD64 role bootc image
        if: inputs.ami_lifecycle != 'retained'
        env:
          ARCH: amd64
          CONTAINER_ENGINE: docker
          IMAGE_NAME: ${{ env.IMAGE_REF }}
          IMAGE_VERSION: ami-validation
        run: nix run .#lucidity -- build "${AMI_ROLE}"

      - name: Build and validate raw AMI artifact
        env:
          AMI_LIFECYCLE: ${{ inputs.ami_lifecycle || 'disposable' }}
        run: |
          if [[ "${AMI_LIFECYCLE}" == retained ]]; then
            sudo env \
              CONTAINER_ENGINE=podman \
              IMAGE_NAME="${IMAGE_REF}" \
              VM_TOOL_IMAGE="${CI_TOOLS_IMAGE}" \
              nix run .#disk -- build "${AMI_ROLE}" ami
            sudo env \
              CONTAINER_ENGINE=podman \
              VM_TOOL_IMAGE="${CI_TOOLS_IMAGE}" \
              nix run .#disk -- validate "${AMI_ARTIFACT}"
          else
            CONTAINER_ENGINE=docker \
              IMAGE_NAME="${IMAGE_REF}" \
              VM_TOOL_IMAGE="${CI_TOOLS_IMAGE}" \
              nix run .#disk -- build "${AMI_ROLE}" ami
            CONTAINER_ENGINE=docker \
              VM_TOOL_IMAGE="${CI_TOOLS_IMAGE}" \
              nix run .#disk -- validate "${AMI_ARTIFACT}"
          fi

      - name: Require configured AWS validation identifiers
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        env:
          RUN_AWS_VALIDATION: ${{ inputs.run_aws_validation }}
          RUN_AWS_LAUNCH: ${{ inputs.run_aws_launch }}
          AMI_LIFECYCLE: ${{ inputs.ami_lifecycle || 'disposable' }}
          IMPORT_ROLE_ARN: ${{ vars.AWS_AMI_IMPORT_ROLE_ARN }}
          SNAPSHOT_KMS_KEY_ARN: ${{ vars.AWS_AMI_SNAPSHOT_KMS_KEY_ARN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_IMAGE_DIGEST: ${{ inputs.source_image_digest }}
          SBOM_SHA256: ${{ inputs.sbom_sha256 }}
          TEST_SUBNET: ${{ vars.AWS_AMI_TEST_SUBNET_ID }}
        run: nix run .#ci -- ami validate-inputs

      - name: Configure short-lived AWS credentials
        if: inputs.run_aws_validation
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          allowed-account-ids: 467590374785
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_AMI_IMPORT_ROLE_ARN }}
          role-duration-seconds: 10800
          role-session-name: lucidity-ami-${{ github.run_id }}

      - name: Validate EBS Direct snapshot and AMI
        if: inputs.run_aws_validation
        env:
          AMI_EXPECTED_BOOTC_IMAGE_REF: ${{ env.IMAGE_REF }}
          AMI_LIFECYCLE: ${{ inputs.ami_lifecycle || 'disposable' }}
          AMI_RELEASE_VERSION: ${{ inputs.release_version }}
          AMI_SBOM_SHA256: ${{ inputs.sbom_sha256 }}
          AMI_SOURCE_IMAGE_DIGEST: ${{ inputs.source_image_digest }}
          AMI_SOURCE_REVISION: ${{ github.sha }}
          AMI_LAUNCH_VALIDATION: ${{ inputs.run_aws_launch }}
          AMI_SNAPSHOT_KMS_KEY_ARN: ${{ vars.AWS_AMI_SNAPSHOT_KMS_KEY_ARN }}
          AMI_TEST_INSTANCE_PROFILE_NAME: ${{ env.TEST_INSTANCE_PROFILE }}
          AMI_TEST_INSTANCE_TYPE: t3a.small
          AMI_TEST_SECURITY_GROUP_ID: ${{ env.TEST_SECURITY_GROUP }}
          AMI_TEST_SUBNET_ID: ${{ vars.AWS_AMI_TEST_SUBNET_ID }}
        run: nix run .#ami -- validate "${AMI_ARTIFACT}"

      - name: Remove retained ECR login
        if: always() && inputs.ami_lifecycle == 'retained'
        run: sudo podman logout "${IMAGE_REF%%/*}"

      - name: Remove GHCR login and BuildKit builder
        if: always() && steps.cache.outcome != 'skipped'
        run: nix run .#lucidity -- ci cache cleanup
