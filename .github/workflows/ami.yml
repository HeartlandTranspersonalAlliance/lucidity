name: Validate AMI compatibility

on:
  pull_request:
    paths:
      - .github/workflows/ami.yml
      - scripts/build-disk.sh
      - scripts/validate-disk.sh
  workflow_call:
    inputs:
      ami_role:
        description: Appliance role to build and validate
        required: true
        type: string
      run_aws_validation:
        description: Upload the raw artifact, register an AMI, and validate its AWS metadata
        required: true
        type: boolean
      ami_lifecycle:
        description: Disposable cleans up; retained preserves an immutable boot-validated AMI
        required: true
        type: string
      run_aws_launch:
        description: Boot the AMI on t3a.small and validate the guest through SSM
        required: true
        type: boolean
      release_version:
        description: Optional immutable vX.Y.Z release associated with a retained AMI
        required: false
        type: string
        default: ""
      source_image_digest:
        description: Optional immutable OCI digest associated with the selected role
        required: false
        type: string
        default: ""
      sbom_sha256:
        description: Optional SHA-256 of the selected role's SPDX SBOM
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ami_role:
        description: Appliance role to build and validate
        required: true
        type: choice
        options:
          - worker
          - controller
        default: worker
      run_aws_validation:
        description: Upload the raw artifact, register a disposable AMI, and validate its AWS metadata
        required: true
        type: boolean
        default: false
      ami_lifecycle:
        description: Disposable validates and cleans up; retained publishes an immutable boot-validated role AMI
        required: true
        type: choice
        options:
          - disposable
          - retained
        default: disposable
      run_aws_launch:
        description: Boot the AMI on t3a.small and validate the guest through SSM
        required: true
        type: boolean
        default: false
      release_version:
        description: Optional immutable vX.Y.Z release associated with a retained AMI
        required: false
        type: string
        default: ""
      source_image_digest:
        description: Optional immutable OCI digest associated with the selected role
        required: false
        type: string
        default: ""
      sbom_sha256:
        description: Optional SHA-256 of the selected role's SPDX SBOM
        required: false
        type: string
        default: ""

concurrency:
  group: ami-validation-${{ github.ref }}-${{ inputs.ami_role || 'worker' }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AMI_ROLE: ${{ inputs.ami_role || 'worker' }}
  AWS_REGION: us-east-2
  CI_TOOLS_IMAGE: localhost/coolify-aws-ci-tools:ami
  IMAGE: localhost/coolify-bootc-${{ inputs.ami_role || 'worker' }}:ami-validation

jobs:
  ami:
    name: Validate ${{ inputs.ami_role || 'worker' }} AMI
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Report runner capacity
        run: |
          df -h /
          docker system df
          sudo podman system df

      - name: Resolve role configuration and image reference
        env:
          AMI_LIFECYCLE: ${{ inputs.ami_lifecycle || 'disposable' }}
          ECR_CONTROLLER_REPOSITORY_URL: ${{ vars.AWS_ECR_CONTROLLER_REPOSITORY_URL }}
          ECR_WORKER_REPOSITORY_URL: ${{ vars.AWS_ECR_WORKER_REPOSITORY_URL }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          TEST_CONTROLLER_INSTANCE_PROFILE: ${{ vars.AWS_AMI_TEST_CONTROLLER_INSTANCE_PROFILE_NAME }}
          TEST_CONTROLLER_SECURITY_GROUP: ${{ vars.AWS_AMI_TEST_CONTROLLER_SECURITY_GROUP_ID }}
          TEST_WORKER_INSTANCE_PROFILE: ${{ vars.AWS_AMI_TEST_WORKER_INSTANCE_PROFILE_NAME }}
          TEST_WORKER_SECURITY_GROUP: ${{ vars.AWS_AMI_TEST_WORKER_SECURITY_GROUP_ID }}
        run: |
          case "${AMI_ROLE}" in
            controller)
              ecr_repository_url=${ECR_CONTROLLER_REPOSITORY_URL}
              test_instance_profile=${TEST_CONTROLLER_INSTANCE_PROFILE}
              test_security_group=${TEST_CONTROLLER_SECURITY_GROUP}
              ;;
            worker)
              ecr_repository_url=${ECR_WORKER_REPOSITORY_URL}
              test_instance_profile=${TEST_WORKER_INSTANCE_PROFILE}
              test_security_group=${TEST_WORKER_SECURITY_GROUP}
              ;;
            *) echo "ami_role must be controller or worker" >&2; exit 2 ;;
          esac
          if [[ "${AMI_LIFECYCLE}" == retained ]]; then
            [[ "${ecr_repository_url}" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9]+([._/-][a-z0-9]+)*$ ]] || {
              echo "the ${AMI_ROLE} ECR repository URL must be configured for retained AMIs" >&2
              exit 1
            }
            if [[ -n "${RELEASE_VERSION}" ]]; then
              image_ref="${ecr_repository_url}:${RELEASE_VERSION}"
            else
              image_ref="${ecr_repository_url}:sha-${GITHUB_SHA}"
            fi
          else
            image_ref="${IMAGE}"
          fi
          {
            echo "AMI_ARTIFACT=image-output/${AMI_ROLE}/coolify-${AMI_ROLE}-ami.raw"
            echo "ECR_REPOSITORY_URL=${ecr_repository_url}"
            echo "IMAGE_REF=${image_ref}"
            echo "TEST_INSTANCE_PROFILE=${test_instance_profile}"
            echo "TEST_SECURITY_GROUP=${test_security_group}"
          } >> "${GITHUB_ENV}"

      - name: Configure AWS credentials for retained ECR candidate
        if: inputs.ami_lifecycle == 'retained'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          allowed-account-ids: 467590374785
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_AMI_IMPORT_ROLE_ARN }}
          role-duration-seconds: 10800
          role-session-name: lucidity-ami-source-${{ github.run_id }}

      - name: Pull immutable ECR role candidate
        if: inputs.ami_lifecycle == 'retained'
        env:
          SOURCE_IMAGE_DIGEST: ${{ inputs.source_image_digest }}
        run: |
          registry=${IMAGE_REF%%/*}
          image_without_tag=${IMAGE_REF%:*}
          repository_name=${image_without_tag#*/}
          source_tag=${IMAGE_REF##*:}
          resolved_digest=$(aws ecr batch-get-image \
            --region "${AWS_REGION}" \
            --repository-name "${repository_name}" \
            --image-ids "imageTag=${source_tag}" \
            --query 'images[0].imageId.imageDigest' \
            --output text)
          [[ ${resolved_digest} =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "retained ${AMI_ROLE} candidate did not resolve to an OCI digest" >&2; exit 1; }
          if [[ -n "${SOURCE_IMAGE_DIGEST}" && "${resolved_digest}" != "${SOURCE_IMAGE_DIGEST}" ]]; then
            echo "retained ${AMI_ROLE} candidate digest does not match the release manifest input" >&2
            exit 1
          fi
          aws ecr get-login-password --region "${AWS_REGION}" | sudo podman login --username AWS --password-stdin "${registry}"
          sudo podman pull "${IMAGE_REF}"
          sudo env \
            PATH="${PATH}" \
            CONTAINER_ENGINE=podman \
            IMAGE_NAME="${IMAGE_REF}" \
            nix run .#lucidity -- build "${AMI_ROLE}" --validate-only
          [[ $(sudo podman image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE_REF}") == linux/amd64 ]] || {
            echo "retained AMI source is not linux/amd64" >&2
            exit 1
          }

      - name: Build pinned image tooling
        env:
          AMI_LIFECYCLE: ${{ inputs.ami_lifecycle || 'disposable' }}
        run: |
          source image/image-builder.env
          if [[ "${AMI_LIFECYCLE}" == retained ]]; then
            sudo podman build \
              --build-arg "IMAGE_BUILDER_IMAGE=${IMAGE_BUILDER_IMAGE}" \
              --tag "${CI_TOOLS_IMAGE}" \
              --file ci/Containerfile \
              .
          else
            docker build \
              --build-arg "IMAGE_BUILDER_IMAGE=${IMAGE_BUILDER_IMAGE}" \
              --tag "${CI_TOOLS_IMAGE}" \
              --file ci/Containerfile \
              .
          fi

      - id: cache
        name: Authenticate to GHCR and restore role-scoped cache
        if: inputs.ami_lifecycle != 'retained'
        env:
          GHCR_CACHE_WRITE: ${{ github.event_name != 'pull_request' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#lucidity -- ci cache configure "${AMI_ROLE}"

      - name: Build AMD64 role bootc image
        if: inputs.ami_lifecycle != 'retained'
        env:
          ARCH: amd64
          CONTAINER_ENGINE: docker
          IMAGE_NAME: ${{ env.IMAGE_REF }}
          IMAGE_VERSION: ami-validation
        run: nix run .#lucidity -- build "${AMI_ROLE}"

      - name: Build and validate raw AMI artifact
        env:
          AMI_LIFECYCLE: ${{ inputs.ami_lifecycle || 'disposable' }}
        run: |
          if [[ "${AMI_LIFECYCLE}" == retained ]]; then
            sudo env \
              CONTAINER_ENGINE=podman \
              IMAGE_NAME="${IMAGE_REF}" \
              VM_TOOL_IMAGE="${CI_TOOLS_IMAGE}" \
              ./scripts/build-disk.sh "${AMI_ROLE}" ami
            sudo env \
              CONTAINER_ENGINE=podman \
              VM_TOOL_IMAGE="${CI_TOOLS_IMAGE}" \
              ./scripts/validate-disk.sh "${AMI_ARTIFACT}"
          else
            CONTAINER_ENGINE=docker \
              IMAGE_NAME="${IMAGE_REF}" \
              VM_TOOL_IMAGE="${CI_TOOLS_IMAGE}" \
              ./scripts/build-disk.sh "${AMI_ROLE}" ami
            CONTAINER_ENGINE=docker \
              VM_TOOL_IMAGE="${CI_TOOLS_IMAGE}" \
              ./scripts/validate-disk.sh "${AMI_ARTIFACT}"
          fi

      - name: Require configured AWS validation identifiers
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        env:
          RUN_AWS_VALIDATION: ${{ inputs.run_aws_validation }}
          RUN_AWS_LAUNCH: ${{ inputs.run_aws_launch }}
          AMI_LIFECYCLE: ${{ inputs.ami_lifecycle || 'disposable' }}
          IMPORT_ROLE_ARN: ${{ vars.AWS_AMI_IMPORT_ROLE_ARN }}
          SNAPSHOT_KMS_KEY_ARN: ${{ vars.AWS_AMI_SNAPSHOT_KMS_KEY_ARN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_IMAGE_DIGEST: ${{ inputs.source_image_digest }}
          SBOM_SHA256: ${{ inputs.sbom_sha256 }}
          TEST_SUBNET: ${{ vars.AWS_AMI_TEST_SUBNET_ID }}
        run: |
          if [[ "${RUN_AWS_LAUNCH}" == true && "${RUN_AWS_VALIDATION}" != true ]]; then
            echo "run_aws_launch requires run_aws_validation" >&2
            exit 1
          fi
          if [[ "${AMI_LIFECYCLE}" == retained ]]; then
            [[ "${RUN_AWS_VALIDATION}" == true ]] || { echo "retained AMI publication requires run_aws_validation" >&2; exit 1; }
            [[ "${RUN_AWS_LAUNCH}" == true ]] || { echo "retained AMI publication requires the EC2 launch gate" >&2; exit 1; }
            [[ "${GITHUB_REF}" == refs/heads/main ]] || { echo "retained AMIs may be published only from main" >&2; exit 1; }
            test -n "${ECR_REPOSITORY_URL}" || { echo "the ${AMI_ROLE} ECR repository URL is required for retained AMIs" >&2; exit 1; }
          fi
          if [[ -n "${RELEASE_VERSION}" || -n "${SOURCE_IMAGE_DIGEST}" || -n "${SBOM_SHA256}" ]]; then
            [[ "${AMI_LIFECYCLE}" == retained ]] || { echo "release metadata is restricted to retained AMIs" >&2; exit 1; }
            [[ "${RELEASE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_version must be v-prefixed SemVer" >&2; exit 1; }
            [[ "${SOURCE_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "source_image_digest must be a lowercase OCI SHA-256 digest" >&2; exit 1; }
            [[ "${SBOM_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "sbom_sha256 must be a lowercase SHA-256 digest" >&2; exit 1; }
          fi
          [[ "${RUN_AWS_VALIDATION}" == true ]] || exit 0
          test -n "${IMPORT_ROLE_ARN}" || { echo "AWS_AMI_IMPORT_ROLE_ARN repository variable is required" >&2; exit 1; }
          test -n "${SNAPSHOT_KMS_KEY_ARN}" || { echo "AWS_AMI_SNAPSHOT_KMS_KEY_ARN repository variable is required" >&2; exit 1; }
          if [[ "${RUN_AWS_LAUNCH}" == true ]]; then
            test -n "${TEST_INSTANCE_PROFILE}" || { echo "the ${AMI_ROLE} AMI test instance-profile repository variable is required" >&2; exit 1; }
            test -n "${TEST_SECURITY_GROUP}" || { echo "the ${AMI_ROLE} AMI test security-group repository variable is required" >&2; exit 1; }
            test -n "${TEST_SUBNET}" || { echo "AWS_AMI_TEST_SUBNET_ID repository variable is required" >&2; exit 1; }
          fi

      - name: Resolve the pinned coldsnap binary
        if: inputs.run_aws_validation
        run: |
          coldsnap_path=$(nix build --no-link --print-out-paths .#coldsnap)
          test -x "${coldsnap_path}/bin/coldsnap"
          echo "COLDSNAP_COMMAND=${coldsnap_path}/bin/coldsnap" >> "${GITHUB_ENV}"

      - name: Configure short-lived AWS credentials
        if: inputs.run_aws_validation
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          allowed-account-ids: 467590374785
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_AMI_IMPORT_ROLE_ARN }}
          role-duration-seconds: 10800
          role-session-name: lucidity-ami-${{ github.run_id }}

      - name: Validate EBS Direct snapshot and AMI
        if: inputs.run_aws_validation
        env:
          AMI_EXPECTED_BOOTC_IMAGE_REF: ${{ env.IMAGE_REF }}
          AMI_LIFECYCLE: ${{ inputs.ami_lifecycle || 'disposable' }}
          AMI_RELEASE_VERSION: ${{ inputs.release_version }}
          AMI_SBOM_SHA256: ${{ inputs.sbom_sha256 }}
          AMI_SOURCE_IMAGE_DIGEST: ${{ inputs.source_image_digest }}
          AMI_SOURCE_REVISION: ${{ github.sha }}
          AMI_LAUNCH_VALIDATION: ${{ inputs.run_aws_launch }}
          AMI_SNAPSHOT_KMS_KEY_ARN: ${{ vars.AWS_AMI_SNAPSHOT_KMS_KEY_ARN }}
          AMI_TEST_INSTANCE_PROFILE_NAME: ${{ env.TEST_INSTANCE_PROFILE }}
          AMI_TEST_INSTANCE_TYPE: t3a.small
          AMI_TEST_SECURITY_GROUP_ID: ${{ env.TEST_SECURITY_GROUP }}
          AMI_TEST_SUBNET_ID: ${{ vars.AWS_AMI_TEST_SUBNET_ID }}
        run: ./scripts/validate-ami-import.sh "${AMI_ARTIFACT}"

      - name: Remove retained ECR login
        if: always() && inputs.ami_lifecycle == 'retained'
        run: sudo podman logout "${IMAGE_REF%%/*}"

      - name: Remove GHCR login and BuildKit builder
        if: always() && steps.cache.outcome != 'skipped'
        run: nix run .#lucidity -- ci cache cleanup
