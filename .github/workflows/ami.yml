name: Validate AMI compatibility

on:
  pull_request:
    paths:
      - .github/workflows/ami.yml
      - Containerfile
      - ci/Containerfile
      - flake.lock
      - flake.nix
      - image/**
      - roles/**
      - scripts/build.sh
      - scripts/build-disk.sh
      - scripts/validate-ami-import.sh
      - scripts/validate-disk.sh
  workflow_dispatch:
    inputs:
      run_aws_validation:
        description: Upload the raw artifact, register a disposable AMI, and validate its AWS metadata
        required: true
        type: boolean
        default: false
      snapshot_upload_mode:
        description: EBS Direct API is the optimized default; VM Import remains the compatibility fallback
        required: true
        type: choice
        options:
          - ebs-direct
          - vmimport
        default: ebs-direct
      run_aws_launch:
        description: Boot the disposable AMI on t3a.small and validate the guest through SSM
        required: true
        type: boolean
        default: false

concurrency:
  group: ami-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  CI_TOOLS_IMAGE: localhost/coolify-aws-ci-tools:ami
  IMAGE: localhost/coolify-bootc-worker:ami-validation

jobs:
  worker-ami:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Report runner capacity
        run: |
          df -h /
          docker system df

      - name: Build pinned image tooling
        run: |
          source image/image-builder.env
          docker build \
            --build-arg "IMAGE_BUILDER_IMAGE=${IMAGE_BUILDER_IMAGE}" \
            --tag "${CI_TOOLS_IMAGE}" \
            --file ci/Containerfile \
            .

      - name: Build AMD64 worker bootc image
        env:
          CONTAINER_ENGINE: docker
          IMAGE_NAME: ${{ env.IMAGE }}
          IMAGE_VERSION: ami-validation
        run: ./scripts/build.sh worker

      - name: Build and validate raw AMI artifact
        env:
          CONTAINER_ENGINE: docker
          IMAGE_NAME: ${{ env.IMAGE }}
          VM_TOOL_IMAGE: ${{ env.CI_TOOLS_IMAGE }}
        run: |
          ./scripts/build-disk.sh worker ami
          ./scripts/validate-disk.sh image-output/worker/coolify-worker-ami.raw

      - name: Require configured AWS validation identifiers
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_AWS_VALIDATION: ${{ inputs.run_aws_validation }}
          RUN_AWS_LAUNCH: ${{ inputs.run_aws_launch }}
          SNAPSHOT_UPLOAD_MODE: ${{ inputs.snapshot_upload_mode }}
          IMPORT_BUCKET: ${{ vars.AWS_AMI_IMPORT_BUCKET }}
          IMPORT_ROLE_ARN: ${{ vars.AWS_AMI_IMPORT_ROLE_ARN }}
          SNAPSHOT_KMS_KEY_ARN: ${{ vars.AWS_AMI_SNAPSHOT_KMS_KEY_ARN }}
          VMIMPORT_ROLE: ${{ vars.AWS_VMIMPORT_ROLE_NAME }}
          TEST_INSTANCE_PROFILE: ${{ vars.AWS_AMI_TEST_INSTANCE_PROFILE_NAME }}
          TEST_SECURITY_GROUP: ${{ vars.AWS_AMI_TEST_SECURITY_GROUP_ID }}
          TEST_SUBNET: ${{ vars.AWS_AMI_TEST_SUBNET_ID }}
        run: |
          if [[ "${RUN_AWS_LAUNCH}" == true && "${RUN_AWS_VALIDATION}" != true ]]; then
            echo "run_aws_launch requires run_aws_validation" >&2
            exit 1
          fi
          [[ "${RUN_AWS_VALIDATION}" == true ]] || exit 0
          test -n "${IMPORT_ROLE_ARN}" || { echo "AWS_AMI_IMPORT_ROLE_ARN repository variable is required" >&2; exit 1; }
          if [[ "${SNAPSHOT_UPLOAD_MODE}" == ebs-direct ]]; then
            test -n "${SNAPSHOT_KMS_KEY_ARN}" || { echo "AWS_AMI_SNAPSHOT_KMS_KEY_ARN repository variable is required" >&2; exit 1; }
          else
            test -n "${IMPORT_BUCKET}" || { echo "AWS_AMI_IMPORT_BUCKET repository variable is required for vmimport" >&2; exit 1; }
            test -n "${VMIMPORT_ROLE}" || { echo "AWS_VMIMPORT_ROLE_NAME repository variable is required for vmimport" >&2; exit 1; }
          fi
          if [[ "${RUN_AWS_LAUNCH}" == true ]]; then
            test -n "${TEST_INSTANCE_PROFILE}" || { echo "AWS_AMI_TEST_INSTANCE_PROFILE_NAME repository variable is required" >&2; exit 1; }
            test -n "${TEST_SECURITY_GROUP}" || { echo "AWS_AMI_TEST_SECURITY_GROUP_ID repository variable is required" >&2; exit 1; }
            test -n "${TEST_SUBNET}" || { echo "AWS_AMI_TEST_SUBNET_ID repository variable is required" >&2; exit 1; }
          fi

      - name: Install Determinate Nix for the pinned EBS uploader
        if: github.event_name == 'workflow_dispatch' && inputs.run_aws_validation && inputs.snapshot_upload_mode == 'ebs-direct'
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Resolve the pinned coldsnap binary
        if: github.event_name == 'workflow_dispatch' && inputs.run_aws_validation && inputs.snapshot_upload_mode == 'ebs-direct'
        run: |
          coldsnap_path=$(nix build --no-link --print-out-paths .#coldsnap)
          test -x "${coldsnap_path}/bin/coldsnap"
          echo "COLDSNAP_COMMAND=${coldsnap_path}/bin/coldsnap" >> "${GITHUB_ENV}"

      - name: Configure short-lived AWS credentials
        if: github.event_name == 'workflow_dispatch' && inputs.run_aws_validation
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          allowed-account-ids: 467590374785
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_AMI_IMPORT_ROLE_ARN }}
          role-duration-seconds: 10800
          role-session-name: lucidity-ami-${{ github.run_id }}

      - name: Validate disposable AWS snapshot and AMI
        if: github.event_name == 'workflow_dispatch' && inputs.run_aws_validation
        env:
          AMI_IMPORT_BUCKET: ${{ vars.AWS_AMI_IMPORT_BUCKET }}
          AMI_LAUNCH_VALIDATION: ${{ inputs.run_aws_launch }}
          AMI_SNAPSHOT_KMS_KEY_ARN: ${{ vars.AWS_AMI_SNAPSHOT_KMS_KEY_ARN }}
          AMI_SNAPSHOT_UPLOAD_MODE: ${{ inputs.snapshot_upload_mode }}
          AMI_TEST_INSTANCE_PROFILE_NAME: ${{ vars.AWS_AMI_TEST_INSTANCE_PROFILE_NAME }}
          AMI_TEST_INSTANCE_TYPE: t3a.small
          AMI_TEST_SECURITY_GROUP_ID: ${{ vars.AWS_AMI_TEST_SECURITY_GROUP_ID }}
          AMI_TEST_SUBNET_ID: ${{ vars.AWS_AMI_TEST_SUBNET_ID }}
          VMIMPORT_ROLE_NAME: ${{ vars.AWS_VMIMPORT_ROLE_NAME }}
        run: ./scripts/validate-ami-import.sh image-output/worker/coolify-worker-ami.raw
