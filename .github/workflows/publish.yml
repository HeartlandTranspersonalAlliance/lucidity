name: Publish bootc images

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish.yml
      - ci/**
      - flake.lock
      - flake.nix
      - nix/**
  workflow_call:
    inputs:
      source_sha:
        description: Exact main-branch commit whose immutable candidates must be published
        required: true
        type: string
  workflow_dispatch:

concurrency:
  group: publish-bootc-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: us-east-2
  IMAGE_TAG: sha-${{ inputs.source_sha || github.sha }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - role: controller
            repository_url: ${{ vars.AWS_ECR_CONTROLLER_REPOSITORY_URL }}
          - role: worker
            repository_url: ${{ vars.AWS_ECR_WORKER_REPOSITORY_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Require configured ECR identifiers
        env:
          PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          REPOSITORY_URL: ${{ matrix.repository_url }}
        run: |
          test -n "${PUBLISH_ROLE_ARN}" || { echo "AWS_ECR_PUBLISH_ROLE_ARN repository variable is required" >&2; exit 1; }
          test -n "${REPOSITORY_URL}" || { echo "AWS_ECR_${{ matrix.role == 'controller' && 'CONTROLLER' || 'WORKER' }}_REPOSITORY_URL repository variable is required" >&2; exit 1; }
          [[ "${IMAGE_TAG}" =~ ^sha-[0-9a-f]{40}$ ]] || { echo "image tag must contain the full Git commit SHA" >&2; exit 1; }
          [[ "${REPOSITORY_URL}" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9]+([._/-][a-z0-9]+)*$ ]] || {
            echo "repository URL is not a private commercial-region ECR repository" >&2
            exit 1
          }

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          allowed-account-ids: 467590374785
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          role-duration-seconds: 3600
          role-session-name: lucidity-publish-${{ github.run_id }}-${{ matrix.role }}

      - name: Resolve immutable image reference
        id: image
        env:
          REPOSITORY_URL: ${{ matrix.repository_url }}
        run: |
          repository_name=${REPOSITORY_URL#*/}
          registry=${REPOSITORY_URL%%/*}
          image_ref=${REPOSITORY_URL}:${IMAGE_TAG}
          existing_digest=$(aws ecr batch-get-image \
            --region "${AWS_REGION}" \
            --repository-name "${repository_name}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'images[0].imageId.imageDigest' \
            --output text)
          if [[ ${existing_digest} =~ ^sha256:[0-9a-f]{64}$ ]]; then
            exists=true
            echo "${image_ref} already exists as ${existing_digest}; retaining the immutable image"
          else
            exists=false
          fi
          {
            printf 'exists=%s\n' "${exists}"
            printf 'image_ref=%s\n' "${image_ref}"
            printf 'registry=%s\n' "${registry}"
            printf 'repository_name=%s\n' "${repository_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Authenticate Docker to ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | \
            docker login --username AWS --password-stdin "${{ steps.image.outputs.registry }}"

      - name: Prepare role-scoped GHCR build cache
        if: steps.image.outputs.exists != 'true'
        env:
          GHCR_CACHE_WRITE: true
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/setup-build-cache.sh "${{ matrix.role }}"

      - name: Build and validate AMD64 bootc image
        if: steps.image.outputs.exists != 'true'
        env:
          ARCH: amd64
          CONTAINER_ENGINE: docker
          IMAGE_NAME: ${{ steps.image.outputs.image_ref }}
          IMAGE_VERSION: ${{ env.IMAGE_TAG }}
        run: |
          nix run .#lucidity -- build "${{ matrix.role }}"
          [[ $(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE_NAME}") == linux/amd64 ]] || {
            echo "local image is not linux/amd64" >&2
            exit 1
          }

      - name: Publish immutable image
        if: steps.image.outputs.exists != 'true'
        run: docker push "${{ steps.image.outputs.image_ref }}"

      - name: Verify published tag and architecture
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          REPOSITORY_NAME: ${{ steps.image.outputs.repository_name }}
        run: |
          remote_digest=$(aws ecr batch-get-image \
            --region "${AWS_REGION}" \
            --repository-name "${REPOSITORY_NAME}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'images[0].imageId.imageDigest' \
            --output text)
          [[ ${remote_digest} =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "ECR did not return the immutable image digest" >&2; exit 1; }
          docker manifest inspect --verbose "${IMAGE_REF}" | \
            jq -e '.Descriptor.platform.os == "linux" and .Descriptor.platform.architecture == "amd64"' >/dev/null
          printf '%s published as %s\n' "${IMAGE_REF}" "${remote_digest}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove ECR login
        if: always() && steps.image.outputs.registry != ''
        run: docker logout "${{ steps.image.outputs.registry }}"

      - name: Remove GHCR login and BuildKit builder
        if: always()
        run: ci/teardown-build-cache.sh
