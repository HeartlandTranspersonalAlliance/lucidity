name: Publish bootc images

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish.yml
      - ci/**
      - flake.lock
      - flake.nix
      - nix/**
  workflow_call:
    inputs:
      source_sha:
        description: Exact main-branch commit whose immutable candidates must be published
        required: true
        type: string
  workflow_dispatch:

concurrency:
  group: publish-bootc-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: us-east-2
  IMAGE_TAG: sha-${{ inputs.source_sha || github.sha }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - role: controller
            repository_url: ${{ vars.AWS_ECR_CONTROLLER_REPOSITORY_URL }}
          - role: worker
            repository_url: ${{ vars.AWS_ECR_WORKER_REPOSITORY_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          allowed-account-ids: 467590374785
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          role-duration-seconds: 3600
          role-session-name: lucidity-publish-${{ github.run_id }}-${{ matrix.role }}

      - name: Resolve immutable image reference and authenticate ECR
        id: image
        env:
          PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          REPOSITORY_URL: ${{ matrix.repository_url }}
          ROLE: ${{ matrix.role }}
        run: nix run .#ci -- ecr resolve "${ROLE}" "${REPOSITORY_URL}" "${IMAGE_TAG}"

      - id: cache
        name: Authenticate to GHCR and restore role-scoped cache
        if: steps.image.outputs.exists != 'true'
        env:
          GHCR_CACHE_WRITE: true
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#ci -- cache configure "${{ matrix.role }}"

      - name: Build and validate AMD64 bootc image
        if: steps.image.outputs.exists != 'true'
        env:
          ARCH: amd64
          CONTAINER_ENGINE: docker
          IMAGE_NAME: ${{ steps.image.outputs.image_ref }}
          IMAGE_VERSION: ${{ env.IMAGE_TAG }}
        run: nix run .#build-${{ matrix.role }}

      - name: Publish immutable image
        if: steps.image.outputs.exists != 'true'
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: nix run .#ci -- ecr push "${IMAGE_REF}"

      - name: Verify published tag and architecture
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          REPOSITORY_NAME: ${{ steps.image.outputs.repository_name }}
        run: nix run .#ci -- ecr verify "${IMAGE_REF}" "${REPOSITORY_NAME}" "${IMAGE_TAG}"

      - name: Remove ECR login
        if: always() && steps.image.outputs.registry != ''
        env:
          REGISTRY: ${{ steps.image.outputs.registry }}
        run: nix run .#ci -- ecr logout "${REGISTRY}"

      - name: Remove GHCR login and BuildKit builder
        if: always() && steps.cache.outcome != 'skipped'
        run: nix run .#ci -- cache cleanup
